[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofchain"
version = "0.1.0"
description = "Verifiable records and tamper detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "cryptography",
    "pypdf",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["proofchain*"]

[tool.setuptools.package-data]
"proofchain.registry" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
