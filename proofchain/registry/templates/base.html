<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Registry{% endblock %} · ProofChain</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>ProofChain <small>registry</small></span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/register" {% if page == 'register' %}aria-current="page"{% endif %}>Register</a>
        <a href="/records" {% if page == 'records' %}aria-current="page"{% endif %}>Records <span class="nav-detail">&amp; batches</span></a>
        <a href="/audit" {% if page == 'audit' %}aria-current="page"{% endif %}>Audit</a>
        <a href="/verify" {% if page == 'verify' %}aria-current="page"{% endif %}>Verify</a>
      </nav>
    </div>
  </header>
  <main class="page-shell">
    {% if notice %}<p class="banner good" role="status">{{ notice }}</p>{% endif %}
    {% if error %}<p class="banner bad" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-mark">ProofChain</span>
      <span>Records are tamper-evident, not tamper-proof. Verification confirms a registered match.</span>
    </div>
  </footer>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
